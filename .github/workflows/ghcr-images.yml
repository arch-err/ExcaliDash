name: GHCR Images

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Fork git ref to build: branch, tag, or full commit SHA"
        required: true
        default: "main"
      image_tag:
        description: "Image tag to publish. Defaults to the resolved short SHA."
        required: false
        default: ""
      platforms:
        description: "Comma-separated target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: arch-err

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: excalidash-backend
            context: backend
            file: backend/Dockerfile
          - component: frontend
            image: excalidash-frontend
            context: .
            file: frontend/Dockerfile

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}
          fetch-depth: 0

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          image="${REGISTRY}/${IMAGE_OWNER}/${{ matrix.image }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.image_tag }}" ]]; then
            primary_tag="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            primary_tag="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            primary_tag="${GITHUB_REF_NAME//\//-}"
          else
            primary_tag="sha-${short_sha}"
          fi

          {
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "image=${image}"
            echo "primary_tag=${primary_tag}"
            echo "tags<<EOF"
            echo "${image}:${primary_tag}"
            echo "${image}:sha-${short_sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.primary_tag }}
